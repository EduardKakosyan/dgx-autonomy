# Models the controller can serve with its own llama-server.
#
# `gguf` is relative to the host models directory (DGX_AUTONOMY_MODELS, default
# /home/jim/models), which the inference container mounts read-only at /models.
# `status: qualified` means `dgx-autonomy qualify` passed on hugo-dgx1 with these
# settings; `measured` is what it recorded (the controller does not read it). The
# records are in /var/lib/dgx-autonomy/qualification/<model>/.
#
# The default is the preferred model, qualified 2026-09-23. It needs the
# reservation (`dgx-autonomy reserve`): the controller refuses to load it while
# claude-qwen holds its memory. Choose the fallback with `--model qwen3.6-35b-a3b`
# to run next to claude-qwen.
default: qwen3.8-flash-next

models:
  qwen3.6-35b-a3b:
    # Apache-2.0 fallback. About 17 GB of weights, so it fits next to claude-qwen.
    repo: unsloth/Qwen3.6-35B-A3B-GGUF
    revision: a483e9e6cbd595906af30beda3187c2663a1118c
    files:
      - Qwen3.6-35B-A3B-UD-Q3_K_XL.gguf
    gguf: qwen3.6-35b-a3b/Qwen3.6-35B-A3B-UD-Q3_K_XL.gguf
    size_bytes: 16845511648
    ctx: 65536
    parallel: 1
    # "embedded" = the Jinja chat template stored in the GGUF metadata.
    template: embedded
    cache_type_k: q8_0
    cache_type_v: q8_0
    max_output_tokens: 16384
    extra_args: []
    status: qualified
    measured:
      # dgx-autonomy qualify, 2026-09-23T23:27Z (claude-qwen displaced), record
      # qualification/qwen3.6-35b-a3b/20260923T232752.json
      load_seconds: 20.4
      memory_gib: 17.6
      tool_call_probes: 5/5
      long_prompt_tokens: 51415
      prefill_tokens_per_s: 2119.8
      decode_tokens_per_s_at_51k: 52.5
      min_available_gib_with_workload: 23.9
      swap_growth_gib: 0.0
      workload_run: 20260923-232902-394983 (VERIFIED)

  qwen3.8-flash-next:
    # The preferred model (Qwen Community License 1.0): 125B total / 6B active MoE.
    # Unsloth's UD-Q3_K_XL pack is three shards, 89,986,353,824 bytes (83.8 GiB);
    # llama.cpp loads a split GGUF from its first shard. It does not fit next to
    # claude-qwen: hold the reservation (`dgx-autonomy reserve`) to use it.
    repo: unsloth/Qwen3.8-Flash-Next-GGUF
    revision: 38bb39ee97821de2c9009abb7e93950eec396e66
    files:
      - UD-Q3_K_XL/Qwen3.8-Flash-Next-UD-Q3_K_XL-00001-of-00003.gguf
      - UD-Q3_K_XL/Qwen3.8-Flash-Next-UD-Q3_K_XL-00002-of-00003.gguf
      - UD-Q3_K_XL/Qwen3.8-Flash-Next-UD-Q3_K_XL-00003-of-00003.gguf
    gguf: qwen3.8-flash-next/UD-Q3_K_XL/Qwen3.8-Flash-Next-UD-Q3_K_XL-00001-of-00003.gguf
    size_bytes: 89986353824
    ctx: 65536
    parallel: 1
    template: embedded
    cache_type_k: q8_0
    cache_type_v: q8_0
    max_output_tokens: 16384
    extra_args: []
    status: qualified
    measured:
      # dgx-autonomy qualify, 2026-09-23T23:20Z (reservation held), record
      # qualification/qwen3.8-flash-next/20260923T232041.json
      load_seconds: 40.4
      memory_gib: 87.7
      tool_call_probes: 5/5
      long_prompt_tokens: 51457
      prefill_tokens_per_s: 632.8
      decode_tokens_per_s_at_51k: 19.5
      min_available_gib_with_workload: 23.9
