# Models the controller can serve with its own inference server (llama.cpp by
# default; `backend: sglang` for the SGLang entries).
#
# `gguf` is relative to the host models directory (DGX_AUTONOMY_MODELS, default
# /home/jim/models), which the inference container mounts read-only at /models.
# `status: qualified` means `dgx-autonomy qualify` passed on hugo-dgx1 with these
# settings; `measured` is what it recorded (the controller does not read it). The
# records are in /var/lib/dgx-autonomy/qualification/<model>/.
#
# The default is the preferred model, qualified 2026-09-23. It needs the
# reservation (`dgx-autonomy reserve`): the controller refuses to load it while
# claude-qwen holds its memory. Choose the fallback with `--model qwen3.6-35b-a3b`
# to run next to claude-qwen.
default: qwen3.8-flash-next

models:
  qwen3.6-35b-a3b:
    # Apache-2.0 fallback. About 17 GB of weights, so it fits next to claude-qwen.
    repo: unsloth/Qwen3.6-35B-A3B-GGUF
    revision: a483e9e6cbd595906af30beda3187c2663a1118c
    files:
      - Qwen3.6-35B-A3B-UD-Q3_K_XL.gguf
    gguf: qwen3.6-35b-a3b/Qwen3.6-35B-A3B-UD-Q3_K_XL.gguf
    size_bytes: 16845511648
    ctx: 65536
    parallel: 1
    # "embedded" = the Jinja chat template stored in the GGUF metadata.
    template: embedded
    cache_type_k: q8_0
    cache_type_v: q8_0
    max_output_tokens: 16384
    reasoning_budget: 8192
    extra_args: []
    status: qualified
    measured:
      # dgx-autonomy qualify, 2026-09-23T23:27Z (claude-qwen displaced), record
      # qualification/qwen3.6-35b-a3b/20260923T232752.json
      load_seconds: 20.4
      memory_gib: 17.6
      tool_call_probes: 5/5
      long_prompt_tokens: 51415
      prefill_tokens_per_s: 2119.8
      decode_tokens_per_s_at_51k: 52.5
      min_available_gib_with_workload: 23.9
      swap_growth_gib: 0.0
      workload_run: 20260923-232902-394983 (VERIFIED)

  qwen3.8-flash-next:
    # The preferred model (Qwen Community License 1.0): 125B total / 6B active MoE.
    # Unsloth's UD-Q3_K_XL pack is three shards, 89,986,353,824 bytes (83.8 GiB);
    # llama.cpp loads a split GGUF from its first shard. It does not fit next to
    # claude-qwen: hold the reservation (`dgx-autonomy reserve`) to use it.
    repo: unsloth/Qwen3.8-Flash-Next-GGUF
    revision: 38bb39ee97821de2c9009abb7e93950eec396e66
    files:
      - UD-Q3_K_XL/Qwen3.8-Flash-Next-UD-Q3_K_XL-00001-of-00003.gguf
      - UD-Q3_K_XL/Qwen3.8-Flash-Next-UD-Q3_K_XL-00002-of-00003.gguf
      - UD-Q3_K_XL/Qwen3.8-Flash-Next-UD-Q3_K_XL-00003-of-00003.gguf
    gguf: qwen3.8-flash-next/UD-Q3_K_XL/Qwen3.8-Flash-Next-UD-Q3_K_XL-00001-of-00003.gguf
    size_bytes: 89986353824
    # Its native context (qwen4exp.context_length). Only 12 of its 48 layers keep a
    # KV cache (full_attention_interval 4, 2 KV heads of 256): about 13 KB a token at
    # q8_0, so 256K costs about 3.2 GiB. The rest are fixed-size recurrent state.
    # Qualified at 65 536 on 2026-09-23 (below); raised for long unattended runs, where
    # the 64K window filled in under an hour (55 781 tokens on the weather run).
    ctx: 262144
    parallel: 1
    template: embedded
    cache_type_k: q8_0
    cache_type_v: q8_0
    # The run has up to 40 hours: thinking long is fine. The budget only stops a
    # runaway thinking loop; a response may still write a large file after it.
    max_output_tokens: 65536
    reasoning_budget: 32768
    # Its template keeps every turn's thinking in the history by default; in a long
    # agent conversation that fills the context several times faster.
    extra_args: ["--no-reasoning-preserve"]
    # 65 536 tokens at about 15 tokens/s (decode slows as the context grows) plus a
    # full prefill of 256K.
    request_timeout_s: 5400
    status: qualified
    measured:
      # dgx-autonomy qualify at 262 144 context, 2026-09-24T12:37Z (reservation held),
      # record qualification/qwen3.8-flash-next/20260924T123724.json. Decode slows as
      # the context fills: about 30 tokens/s near empty, 19.5 at 51K (2026-09-23
      # record 20260923T232041.json, at 65 536), 8.4 at 206K.
      load_seconds: 60.4
      memory_gib: 91.2
      tool_call_probes: 5/5
      long_prompt_tokens: 205603
      prefill_tokens_per_s: 387.5
      decode_tokens_per_s_at_206k: 8.4
      min_available_gib_with_workload: 16.3
      swap_growth_gib: 0.0
      workload_run: 20260924-124743-98ffd8 (VERIFIED)

  qwen3.8-flash-next-sglang:
    # The same model served by SGLang from the NVFP4 checkpoint (4-bit, calibrated),
    # following the SGLang cookbook's single-DGX-Spark low-latency cell. llama.cpp
    # computes QSA as dense attention under a mask, so its decode falls from 25 to 8
    # tokens/s between an empty and a 225K context (weather run, 2026-09-25); SGLang
    # has sparse QSA kernels. The 47.7 GiB N-gram (PLE) table does not fit in memory
    # next to the weights: it is a sparse file in <data dir>/inference/ple on the NVMe,
    # rewritten on every boot (about 10 minutes). No reasoning budget: SGLang has no
    # equivalent of llama.cpp's, so max_output_tokens alone bounds a response.
    backend: sglang
    # Pulled 2026-09-25: the arm64 build that knows --ple-offload-backend file.
    image: lmsysorg/sglang:dev-qwen38-next-local@sha256:9d2a843c706c74bc259c0d9abf360551eb2734e1e7d255ab012a6965f10480b6
    repo: RadixArk/Qwen3.8-Flash-Next-NVFP4
    revision: 7b719225242aacd3dbd3f9407468c2ee9a9d2594
    path: qwen3.8-flash-next-nvfp4
    # 419 files, 135,253,622,894 bytes (126.0 GiB), 47.7 GiB of it the PLE table.
    size_bytes: 135253622894
    # --mem-fraction-static of the GB10's memory: 79.7 GB of weights, 3.8 GB of MTP
    # draft, the mamba pool (2.5 GB) and the KV pool, about 25 KB a token in bf16. At
    # 0.80 the KV pool held only 131,712 tokens (first qualification, 2026-09-25) with
    # 21.7 GiB left free; 0.84 adds about 4.8 GB, room for the full 262K context.
    mem_fraction: 0.84
    resident_bytes: 105000000000
    ctx: 262144
    # Two requests (the builder, and a planner or qualification probe); the mamba
    # pool holds 5 states a request with MTP.
    parallel: 2
    max_output_tokens: 65536
    request_timeout_s: 5400
    extra_args: [
      "--tp", "1",
      "--quantization", "modelopt_fp4",
      "--fp4-gemm-backend", "flashinfer_cutlass",
      "--page-size", "64",
      "--chunked-prefill-size", "4096",
      "--speculative-algorithm", "NEXTN",
      "--speculative-num-steps", "3",
      "--speculative-eagle-topk", "1",
      "--speculative-num-draft-tokens", "4",
      "--max-mamba-cache-size", "10",
      "--ple-offload-embedding",
      "--ple-offload-backend", "file",
      "--reasoning-parser", "qwen3",
      "--tool-call-parser", "auto",
    ]
    status: qualified
    measured:
      # dgx-autonomy qualify, 2026-09-25T16:15Z (reservation held), record
      # qualification/qwen3.8-flash-next-sglang/20260925T161541.json. At 0.80 the KV
      # pool held 131,712 tokens and the long prompt was refused (20260925T160148).
      load_seconds: 714.9
      memory_gib: 101.2
      kv_pool_tokens: 279360
      tool_call_probes: 5/5
      long_prompt_tokens: 205603
      prefill_tokens_per_s: 1939.7
      decode_tokens_per_s_at_206k: 13.6
      decode_tokens_per_s_near_empty: 19-34 (MTP accepts 3.3-3.7 of 4)
      # Tighter than llama.cpp (16.3): watch memory on runs with heavy browser tests.
      min_available_gib_with_workload: 9.26
      swap_growth_gib: 0.585
      workload_run: 20260925-162942-331fa7 (VERIFIED in 4 minutes)
