# The operator runs this once, with sudo (see ../README.md):
#
#   sudo docker compose --profile images build
#   sudo docker compose up -d controller
#
# Only the controller is a long-running compose service. The inference, agent and
# evaluator containers are created by the controller per run; their services here
# exist only so `--profile images build` builds all four images.
#
# Values come from .env next to this file. scripts/deploy.sh writes it on the DGX.

name: dgx-autonomy

services:
  controller:
    image: dgx-autonomy/controller:local
    build:
      context: ..
      dockerfile: containers/controller.Dockerfile
    restart: unless-stopped
    environment:
      DGX_AUTONOMY_DATA: ${DGX_AUTONOMY_DATA:-/var/lib/dgx-autonomy}
      DGX_AUTONOMY_MODELS: ${DGX_AUTONOMY_MODELS:-/home/jim/models}
      DGX_AUTONOMY_OPERATOR_UID: ${DGX_AUTONOMY_OPERATOR_UID:?set the operator uid in .env}
      DGX_AUTONOMY_OPERATOR_GID: ${DGX_AUTONOMY_OPERATOR_GID:?set the operator gid in .env}
      DGX_AUTONOMY_INFERENCE_IMAGE: dgx-autonomy/inference:f95b0d9
      DGX_AUTONOMY_AGENT_IMAGE: dgx-autonomy/agent:1.49.4
      DGX_AUTONOMY_EVALUATOR_IMAGE: dgx-autonomy/evaluator:1.63.0
    volumes:
      # The only Docker socket mount in the system.
      - /var/run/docker.sock:/var/run/docker.sock
      # Same path inside and out, so the bind-mount sources the controller passes to
      # `docker run` are valid host paths.
      - ${DGX_AUTONOMY_DATA:-/var/lib/dgx-autonomy}:${DGX_AUTONOMY_DATA:-/var/lib/dgx-autonomy}
    networks:
      - internal
      - egress
    # No ports: the control API is a unix socket under the data directory.

  inference-image:
    image: dgx-autonomy/inference:f95b0d9
    build:
      context: .
      dockerfile: inference.Dockerfile
    profiles: [images]

  agent-image:
    image: dgx-autonomy/agent:1.49.4
    build:
      # autonomy/: the image copies containers/sandbox/ and src/dgx_autonomy/demo_tool.py.
      context: ..
      dockerfile: containers/agent.Dockerfile
    profiles: [images]

  evaluator-image:
    image: dgx-autonomy/evaluator:1.63.0
    build:
      # autonomy/: the image copies containers/evaluator/ (lockfiles, Playwright config).
      context: ..
      dockerfile: containers/evaluator.Dockerfile
    profiles: [images]

# The bridges have fixed host interface names: the host egress rules
# (host/nftables-autonomy.nft) match them, and the controller refuses to start an
# agent container when the names differ. Renaming means recreating the networks.
networks:
  # Controller <-> Agent Server <-> llama-server. No route out.
  internal:
    name: dgx-autonomy-internal
    internal: true
    driver_opts:
      com.docker.network.bridge.name: dgx-internal
  # Internet access for the agent's dependency installs and research. The host rules
  # keep it off the DGX itself, the LAN and the tailnet; a Docker bridge alone is not
  # a policy.
  egress:
    name: dgx-autonomy-egress
    driver_opts:
      com.docker.network.bridge.name: dgx-egress
